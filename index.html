<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shadow Studios</title>
    <meta name="description" content="Shadow Studios makes casual mobile games, including Fruity Pop 3D." />
    <style>
      :root {
        --bg: #000;
        --card: #17121f;
        --ink: #f1ecfa;
        --ink-soft: #b3a9c6;
        --line: #2c2340;
        --accent: #b99bff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      main {
        width: 100%;
        max-width: 560px;
        padding: 48px 16px;
        text-align: center;
      }
      h1 {
        margin: 0 0 14px;
      }
      h1 img {
        display: block;
        width: min(80vw, 360px);
        height: auto;
        margin: 0 auto;
      }
      .tag {
        margin: 0 0 36px;
        color: var(--ink-soft);
      }
      .game {
        padding: 22px 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        text-align: left;
      }
      .game h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .game p {
        margin: 0 0 14px;
        color: var(--ink-soft);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
      }
      a {
        color: var(--accent);
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      footer {
        margin-top: 32px;
        color: var(--ink-soft);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="shadow-studios.png" width="1200" height="348" alt="Shadow Studios" /></h1>
      <p class="tag">Casual games for mobile.</p>
      <div class="game">
        <h2>Fruity Pop 3D</h2>
        <p>Drop, match and pop fruits in a cute 3D merge puzzle.</p>
        <div class="links">
          <a href="privacy-policy.html">Privacy policy</a>
          <a href="mailto:helpshadowstudios@gmail.com">Contact</a>
        </div>
      </div>
      <footer>helpshadowstudios@gmail.com</footer>
    </main>
  </body>
</html>
